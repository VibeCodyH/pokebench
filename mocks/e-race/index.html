<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokéBench — Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
<style>
  :root {
    --bg: #f4eed8; --card: #fbf7e8; --ink: #1e1b16; --gold: #f7d45c; --green: #d7e6bf; --blue: #cfe8f0;
    --muted: #4a4539; --progress: #7f9e6c; --track: #e2cf7a; --stuck: #ece5cc; --offline: #c9c1a6; --teal: #7fb5a3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 'IBM Plex Mono', ui-monospace, monospace; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  a { color: inherit; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
  .page { max-width: 1040px; margin: 0 auto; padding: 28px 20px 60px; display: grid; gap: 22px; }
  .box { background: var(--card); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); }
  .btn { font-weight: 700; background: var(--card); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 6px 12px; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn[aria-pressed="true"] { background: var(--gold); }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  /* masthead: logo + wordmark + socials, same links as the live site */
  .masthead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand-mark { width: 44px; height: 44px; object-fit: contain; image-rendering: pixelated; }
  .brand h1 { margin: 0; font-size: 22px; line-height: 1.1; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .socials { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .social-button { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 3px solid var(--ink); background: var(--card); box-shadow: 3px 3px 0 var(--ink); }
  .social-icon { width: 14px; height: 14px; fill: currentColor; }
  .live-pill { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border: 3px solid var(--ink); background: var(--card); box-shadow: 3px 3px 0 var(--ink); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-decoration: none; }
  .live-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--offline); border: 2px solid var(--ink); }
  .live-pill.live .live-dot { background: #e0524a; }
  .banner { background: var(--gold); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 8px 14px; font-weight: 700; font-size: 12px; letter-spacing: .12em; text-align: center; }

  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; align-items: end; margin-top: 12px; }
  .pod { display: grid; padding: 0; text-align: left; position: relative; }
  .pod .body { padding: 16px 92px 14px 16px; display: grid; gap: 6px; }
  .pod .place { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
  .pod .name { font-size: 18px; font-weight: 700; line-height: 1.15; }
  .pod .meta { color: var(--muted); font-size: 13px; }
  .pod .result { font-weight: 700; margin-top: 4px; }
  .pod .foot { padding: 8px 16px; border-top: 3px solid var(--ink); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .pod-sprite { position: absolute; right: 14px; bottom: 50px; width: 56px; height: auto; shape-rendering: crispEdges; }
  .pod.first { background: var(--gold); }
  .pod.first .body { padding-top: 28px; }
  .pod.first .place, .pod.first .meta { color: var(--ink); }
  .pod.first .foot { background: var(--ink); color: var(--gold); }
  .foot.local { background: var(--green); }
  .foot.api { background: var(--blue); }

  .race { padding: 18px 20px 22px; display: grid; gap: 14px; }
  .track { position: relative; height: 12px; background: var(--track); border: 3px solid var(--ink); margin: 20px 4px 44px; }
  .stops { position: absolute; inset: -3px; display: flex; justify-content: space-between; align-items: center; }
  .stop { position: relative; display: block; padding: 0; border: 0; background: transparent; }
  .stop i { display: block; width: 14px; height: 14px; background: var(--card); border: 3px solid var(--ink); }
  .stop.filled i { background: var(--ink); }
  .stop[aria-pressed="true"] i { background: var(--gold); }
  .stop span { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 84px; text-align: center; font-size: 10px; font-weight: 700; line-height: 1.2; color: var(--muted); }
  .stop[aria-pressed="true"] span { color: var(--ink); }

  .rank-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rank-head h2 { margin: 0; font-size: 16px; }
  .rank-head .count { color: var(--muted); font-size: 13px; }
  .filters { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: var(--gold); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 4px 8px 4px 10px; font-size: 12px; font-weight: 700; }
  .chip button { all: unset; cursor: pointer; font-weight: 700; font-size: 14px; line-height: 1; padding: 0 2px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px; margin-top: 16px; }
  .trainer { display: grid; grid-template-rows: 1fr auto; padding: 0; text-align: left; width: 100%; }
  .trainer:hover, .pod:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
  .trainer .body { padding: 14px; display: grid; gap: 10px; }
  .trainer .top { display: flex; align-items: center; gap: 10px; }
  .rank { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border: 3px solid var(--ink); font-weight: 700; font-size: 13px; background: var(--card); }
  .rank.top3 { background: var(--gold); }
  .trainer .name { font-size: 16px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kv .label { font-size: 10px; }
  .kv .value { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .tagrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ptag { font-size: 11px; font-weight: 700; letter-spacing: .1em; padding: 2px 6px; border: 2px solid var(--ink); }
  .ptag.local { background: var(--green); } .ptag.api { background: var(--blue); }
  .bar { width: 96px; height: 10px; border: 2px solid var(--ink); background: var(--card); }
  .bar i { display: block; height: 100%; background: var(--progress); }
  .trainer .foot { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-top: 3px solid var(--ink); font-size: 12px; font-weight: 700; background: var(--stuck); }
  .trainer .foot.won { background: var(--gold); }
  .sq { width: 10px; height: 10px; flex: none; border: 2px solid var(--ink); background: var(--green); }
  .foot.won .sq { background: var(--ink); }
  .empty { grid-column: 1 / -1; border: 3px dashed var(--ink); padding: 36px; text-align: center; color: var(--muted); font-weight: 700; }

  dialog#run-modal { width: min(560px, calc(100% - 32px)); max-height: 88dvh; overflow: auto; padding: 0; border: 3px solid var(--ink); background: #f8f7eb; box-shadow: 7px 7px 0 var(--ink); }
  dialog#run-modal::backdrop { background: #1e1b16cc; }
  .modal-close { position: absolute; top: 6px; right: 6px; z-index: 2; width: 30px; height: 30px; border: 2px solid #f8f7eb; border-radius: 5px; background: #101c20; color: #f8f7eb; font-weight: 700; font-size: 15px; }

  @media (max-width: 720px) {
    .masthead { gap: 10px; }
    .brand p { display: none; }
    .socials { margin-left: auto; gap: 7px; }
    .live-pill { padding: 0 8px; }
    .podium { grid-template-columns: 1fr; }
    .pod.first { order: -1; }
    .pod.first .body { padding-top: 16px; }
    /* the track becomes a two-column list of labelled stops */
    .track { height: auto; background: none; border: 0; margin: 4px 0 0; }
    .stops { position: static; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stop { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 3px solid var(--ink); background: var(--card); box-shadow: 3px 3px 0 var(--ink); }
    .stop[aria-pressed="true"] { background: var(--gold); }
    .stop i { flex: none; }
    .stop span { position: static; transform: none; width: auto; text-align: left; font-size: 11px; }
    .filters { margin-left: 0; }
  }
</style>
</head>

  <g id="art-trophy"><path d="M7 3h18v4h6v12h-5v5h-8v6h7v5H7v-5h7v-6H6v-5H1V7h6z" fill="#172a24"/><path d="M9 5h14v13l-4 4h-6l-4-4z" fill="#fff0a4"/><path d="M16 5h7v13l-4 4h-3z" fill="#d89125"/><path d="M4 10h3v7H4m21-7h3v7h-3M15 23h2v8h-2M9 32h14v1H9" fill="#ffdc69"/></g><pattern id="brick" width="100" height="48" patternUnits="userSpaceOnUse"><path d="M0 0h100M0 24h100M0 48h100M50 0v24M0 24v24M100 24v24" fill="none" stroke="#182f2b" stroke-width="3"/><path d="M4 4h40M54 28h40" stroke="#76816a" stroke-width="2" opacity=".24"/></pattern>
  <symbol id="art-flag" viewBox="0 0 24 24"><path d="M5 2h2v20H5z" fill="#334746"/><path d="M7 3h13l-4 5 4 5H7z" fill="#ff7661"/></symbol>
  <symbol id="art-pin" viewBox="0 0 24 24"><path d="M12 2c-4 0-7 3-7 7 0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z" fill="#e9765d"/><circle cx="12" cy="9" r="3" fill="#f8f7eb"/></symbol>
</defs></svg>

<script src="card.js"></script>
<script>
function jacketColor(run) {
  if (local(run)) return '#3f8f52';
  const p = String(run.provider || '').toLowerCase();
  if (p.includes('openai')) return '#1f8f86';
  if (p.includes('anthropic')) return '#c1694a';
  if (p.includes('google')) return '#3b82c4';
  if (p.includes('xai')) return '#1c2733';
  return '#c9a227';
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const adj = v => Math.max(0, Math.min(255, Math.round(v + amt)));
  return '#' + [adj(r), adj(g), adj(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}
// Same trainer paths as #art-trainer, emitted inline (not <use>) so the cap/jacket fill can be
// swapped per model. Skin, shorts and shoes keep their original colours.
function trainerFor(run, cx, footY) {
  const scale = 34 / 32, cap = jacketColor(run), sleeve = shade(cap, -30);
  const tx = (cx - 16 * scale).toFixed(2), ty = (footY - 46 * scale).toFixed(2);
  return `<g transform="translate(${tx} ${ty}) scale(${scale.toFixed(4)})">`
    + `<path d="M5 41h25v5H5z" fill="#122b3c55"/>`
    + `<path d="M8 4h16v4h5v9H4V9h4z" fill="${cap}"/>`
    + `<path d="M9 5h11v4H9z" fill="#ffd2a0"/>`
    + `<path d="M9 17h17v12H9z" fill="#edc18e"/>`
    + `<path d="M7 18h6v9H7z" fill="#334b47"/>`
    + `<path d="M7 29h18v11H7z" fill="#d7d9b4"/>`
    + `<path d="M5 30h6v9H5zM23 30h5v9h-5z" fill="${sleeve}"/>`
    + `<path d="M9 40h6v6H9zM20 40h6v6h-6z" fill="#243e50"/>`
    + `</g>`;
}
const rankSort = (a, b) => b.furthest_index - a.furthest_index || a.turns_used - b.turns_used || String(a.model).localeCompare(String(b.model));
const stopLabel = run => milestoneList[run.furthest_index]?.short || 'No milestone';

const state = { runs: [], type: 'all', stop: null, sample: true, live: false, selected: new Set() };
const typeMatch = run => state.type === 'all' || (state.type === 'local') === local(run);
const visible = () => state.runs.filter(run => typeMatch(run) && (state.stop === null || run.furthest_index === state.stop));

function podiumMarkup(run, place) {
  if (!run) return '';
  const foot = place === 1 ? 'Champion' : local(run) ? 'Local' : 'API';
  const footCls = place === 1 ? '' : local(run) ? 'local' : 'api';
  return `<button type="button" class="box pod ${place === 1 ? 'first' : ''}" data-uid="${escape(run.uid)}" aria-label="${escape(run.model)}, ${['1st','2nd','3rd'][place - 1]} place, open run details">
    <div class="body">
      <span class="place">${['1st','2nd','3rd'][place - 1]}</span>
      <span class="name">${escape(run.model)}</span>
      <span class="meta">${number(run.turns_used)} turns · ${price(run)}</span>
      <span class="result">${escape(stopLabel(run))}</span>
    </div>
    <svg class="pod-sprite" viewBox="0 0 34 51" aria-hidden="true">${trainerFor(run, 17, 51)}</svg>
    <div class="foot ${footCls}">${foot}</div>
  </button>`;
}

function cardMarkup(run, rank) {
  const done = won(run);
  const width = Math.round((run.furthest_index + 1) / milestoneList.length * 100);
  return `<button type="button" class="box trainer" data-uid="${escape(run.uid)}" aria-label="${escape(run.model)}, rank ${rank}, ${escape(stopLabel(run))}, open run details">
    <div class="body">
      <div class="top"><span class="rank ${rank <= 3 ? 'top3' : ''}">${rank}</span><span class="name">${escape(run.model)}</span></div>
      <div class="kv">
        <div><div class="label">Turns</div><div class="value">${number(run.turns_used)}</div></div>
        <div><div class="label">Run cost</div><div class="value">${price(run)}</div></div>
      </div>
      <div class="tagrow"><span class="ptag ${local(run) ? 'local' : 'api'}">${local(run) ? 'LOCAL' : 'API'}</span><span class="bar" title="${width}%"><i style="width:${width}%"></i></span></div>
    </div>
    <div class="foot ${done ? 'won' : ''}"><span class="sq"></span>${escape(stopLabel(run))}</div>
  </button>`;
}

function render() {
  const ranked = [...state.runs].sort(rankSort);
  $('podium').innerHTML = [ranked[1], ranked[0], ranked[2]].map((run, i) => podiumMarkup(run, [2, 1, 3][i])).join('');

  const rankOf = new Map(ranked.map((run, i) => [run, i + 1]));
  const shown = visible().sort(rankSort);
  $('grid').innerHTML = shown.length ? shown.map(run => cardMarkup(run, rankOf.get(run))).join('')
    : '<div class="empty">No trainers match this filter.</div>';
  $('count').textContent = `${shown.length} of ${state.runs.length} models`;

  $('stops').innerHTML = milestoneList.map((s, i) =>
    `<button type="button" class="stop ${state.stop === null ? 'filled' : ''}" aria-pressed="${state.stop === i}" data-stop="${i}" aria-label="${escape(s.label)}"><i></i><span>${escape(s.short)}</span></button>`).join('');

  const counts = { all: state.runs.length, local: state.runs.filter(local).length, api: state.runs.filter(r => !local(r)).length };
  const chip = state.stop === null ? '' :
    `<span class="chip">Stop: ${escape(milestoneList[state.stop].short)}<button type="button" data-clear aria-label="Clear stop filter">×</button></span>`;
  $('filters').innerHTML = chip + ['all', 'local', 'api'].map(t =>
    `<button type="button" class="btn" data-type="${t}" aria-pressed="${state.type === t}">${t === 'all' ? 'All' : t === 'local' ? 'Local' : 'API'} (${counts[t]})</button>`).join('');

  $('banner').hidden = !state.sample;
  $('live-pill').classList.toggle('live', state.live);
  $('live-text').textContent = state.live ? 'LIVE' : 'OFFLINE';
}

document.querySelector('.page').addEventListener('click', e => {
  const stop = e.target.closest('[data-stop]');
  const type = e.target.closest('[data-type]');
  const open = e.target.closest('[data-uid]');
  if (stop) { const i = +stop.dataset.stop; state.stop = state.stop === i ? null : i; }
  else if (type) state.type = type.dataset.type;
  else if (e.target.closest('[data-clear]')) state.stop = null;
  else if (open) { const run = state.runs.find(r => r.uid === open.dataset.uid); if (run) openModal(run, open); return; }
  else return;
  render();
});

fetch('../mock-runs.json').then(r => r.json()).then(rows => {
  state.runs = rows.filter(run => finite(run.furthest_index)).map((r, i) => ({ ...r, uid: r.run_id || 'run-' + i }));
  render();
}).catch(err => { $('grid').innerHTML = `<div class="empty">Could not load runs: ${escape(err.message)}</div>`; });
</script>
</body>
</html>
