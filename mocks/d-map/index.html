<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2dd4bf">
<title>PokéBench · The Map (mock D)</title>
<style>
:root {
  --ink: #101c20; --paper: #f8f7eb; --teal: #2dd4bf; --blue: #38bdf8;
  --cyan: #00f0f0; --gold: #ffce52; --red: #ff7661; --muted: #506157;
  --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --header: 76px; --banner: 40px; --railh: 36px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.6 var(--sans); }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
a { color: inherit; }
h1, h2, h3, p, dl, dd, ol, ul { margin: 0; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid #008577; outline-offset: 3px; }
[hidden] { display: none !important; }
img { max-width: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.skip { position: fixed; top: -100px; left: 16px; padding: 12px 18px; background: var(--teal); z-index: 100; border: 3px solid var(--ink); font-weight: 800; }
.skip:focus { top: 12px; }

/* masthead, reproduced from site/styles.css + site/index.html */
.masthead { min-height: var(--header); position: sticky; top: 0; z-index: 30; background: var(--paper); border-bottom: 3px solid var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 12px 24px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; flex: none; }
.brand-mark { width: 40px; height: 40px; object-fit: contain; image-rendering: pixelated; }
.wordmark { display: block; font: 950 22px/1.1 var(--mono); letter-spacing: -1.2px; }
.wordmark > span { color: #008577; }
.tagline { display: block; font-size: 9px; color: #4b5c53; margin-top: 4px; }
.socials { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.social-button { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); background: #efe9cf; box-shadow: 3px 3px 0 var(--ink); color: var(--ink); }
.social-icon { width: 14px; height: 14px; fill: currentColor; }
.live-pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 8px; border: 2px solid var(--ink); border-radius: 15px; background: #e9eade; box-shadow: 3px 3px 0 var(--ink); font: 900 10px var(--mono); letter-spacing: 1px; color: #4b5c53; text-decoration: none; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #8f9a92; }
.sample-banner { min-height: var(--banner); position: sticky; top: var(--header); z-index: 29; display: flex; gap: 16px; align-items: center; justify-content: center; padding: 6px 16px; border-bottom: 2px solid var(--ink); background: var(--gold); font: 800 11px/1.5 var(--mono); text-align: center; }
.sample-badge { padding: 2px 6px; border: 1px dashed currentColor; font: 800 9px/1.5 var(--mono); white-space: nowrap; }

/* YOU ARE HERE sticky rail strip — a thin bar, never covers the map */
.rail-strip { min-height: var(--railh); position: sticky; top: calc(var(--header) + var(--banner)); z-index: 28; display: flex; align-items: center; gap: 10px; padding: 6px 16px; background: #eef1e3; border-bottom: 2px solid var(--ink); overflow-x: auto; }
.rail-label { flex: none; font: 850 9px/1.5 var(--mono); letter-spacing: .06em; color: #34492f; }
.rail-dots { display: flex; gap: 6px; list-style: none; padding: 0; margin: 0; }
.rail-dot { display: inline-flex; align-items: center; gap: 5px; min-height: 26px; padding: 3px 9px; border: 1px solid #9db08d; border-radius: 12px; background: var(--paper); font: 800 9px/1.5 var(--mono); white-space: nowrap; background: transparent; border: 1px solid transparent; color: var(--muted); }
.rail-dot.is-current { background: var(--ink); color: var(--paper); border-color: var(--ink); }

#main { padding-bottom: 60px; }
#data-state { padding: 60px 20px; text-align: center; font: 750 12px var(--mono); }

.stage-desktop { display: grid; grid-template-columns: minmax(0,1fr) 75vw minmax(0,1fr); justify-content: center; align-items: start; gap: 20px; width: 100%; margin: 26px auto 0; padding: 0 16px; }
.map-col { position: relative; border: 3px solid var(--ink); box-shadow: 6px 6px 0 #101c2022; }
.map-svg { display: block; width: 100%; height: auto; shape-rendering: crispEdges; }
.band-sentinel { position: absolute; left: 0; width: 1px; pointer-events: none; }
.gutter { position: relative; display: flex; flex-direction: column; }
.band-stack { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 4px 0 22px; }
.band-stack::before { content: ""; position: absolute; top: 16px; width: 26px; height: 0; border-top: 2px dashed #7c8a72; }
.gutter.left .band-stack::before { right: -26px; }
.gutter.right .band-stack::before { left: -26px; }
.band-stack.is-empty::before { display: none; }
.band-flag { display: none; }
.band-stack:not(.is-empty) .band-flag { display: inline-flex; align-items: center; gap: 5px; font: 800 8px/1.5 var(--mono); color: #46583e; margin-bottom: 2px; }
.band-flag svg { width: 11px; height: 11px; }

/* compact on-map card — the always-visible unit; ~2 lines, target <=52px tall */
.compact-card { position: relative; width: 100%; max-width: none; text-align: left; background: var(--paper); border: 2px solid var(--ink); border-radius: 7px; box-shadow: 3px 3px 0 var(--ink); padding: 6px 9px; display: flex; flex-direction: column; justify-content: center; gap: 3px; transition: transform .1s ease, box-shadow .1s ease; }
.compact-card:hover, .compact-card:focus-visible { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--ink); }
.compact-card.is-winner { border-color: #7a5f14; box-shadow: 0 0 0 2px var(--gold), 3px 3px 0 var(--ink); }
.compact-card.is-winner:hover, .compact-card.is-winner:focus-visible { box-shadow: 0 0 0 2px var(--gold), 5px 5px 0 var(--ink); }
.rank-badge { position: absolute; top: -8px; left: -8px; width: 20px; height: 20px; display: grid; place-items: center; background: var(--gold); border: 2px solid var(--ink); border-radius: 50%; font: 900 9px/1 var(--mono); box-shadow: 2px 2px 0 var(--ink); }
.cc-model { display: block; font: 800 11px/1.25 var(--mono); letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-line2 { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 3px 8px; font: 700 9px/1.3 var(--mono); color: var(--muted); }
.cc-turn { flex: 1 1 100%; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-foot { display: flex; align-items: center; gap: 6px; flex: none; }
.tag { display: inline-flex; padding: 2px 5px; border: 1px solid #748379; border-radius: 3px; font: 800 8px/1.5 var(--mono); }
.tag.local { background: #d9edbf; }
.tag.api { background: #cceef7; }
.cc-cost { font: 800 9px/1.4 var(--mono); }
.cc-cost.free { color: #096b52; }

/* phone: sliced band blocks */
.stage-phone { display: none; }
.phone-band { border-bottom: 3px solid var(--ink); }
.phone-band-img { position: relative; width: 100%; border-bottom: 2px solid var(--ink); }
.phone-band-svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
.phone-band-cards { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 20px; }
.phone-band-heading { font: 850 10px/1.5 var(--mono); letter-spacing: .05em; padding: 10px 16px 0; color: #34492f; }
.phone-band-cards .compact-card { max-width: none; }
.phone-band-empty { padding: 4px 16px 16px; font: 700 10px/1.6 var(--mono); color: var(--muted); }

/* modal chrome */
dialog#run-modal { width: min(560px, calc(100% - 32px)); max-height: 88dvh; overflow: auto; background: var(--paper); color: var(--ink); padding: 0; border: 3px solid var(--ink); border-radius: 9px; box-shadow: 7px 7px 0 var(--teal); }
dialog#run-modal::backdrop { background: #101c20c9; }
.modal-close { position: absolute; top: 6px; right: 6px; z-index: 2; width: 30px; height: 30px; border: 2px solid var(--paper); border-radius: 5px; background: var(--ink); color: var(--paper); font: 800 15px var(--mono); }

/* the modal's content = the live site's run card, copied verbatim from site/styles.css */
.sprite-defs { position: absolute; overflow: hidden; }
.run-card { color: var(--ink); min-width: 0; text-align: left; overflow-wrap: anywhere; perspective: 1500px; cursor: pointer; touch-action: manipulation; border-radius: 9px; }
.card-inner { display: grid; position: relative; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.2,.7,.2,1); }
.run-card:not(.is-flipped) .card-back, .run-card.is-flipped .card-front { position: absolute; inset: 0; overflow: hidden; }
.run-card.is-flipped .card-inner { transform: rotateY(180deg); }
.card-face { grid-area: 1 / 1; min-width: 0; display: flex; flex-direction: column; background: var(--paper); border: 3px solid var(--ink); border-radius: 9px; box-shadow: 5px 6px 0 var(--ink); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.card-front { transform: rotateY(0deg); }
.card-back { transform: rotateY(180deg); }
.card-face[inert] { pointer-events: none; }
.card-front .card-body { display: flex; flex-direction: column; flex: 1; }
.flip-hint { margin-block: auto; padding: 30px 0; color: #35654f; font: 800 12px/1.7 var(--mono); text-align: center; }
.flip-hint span { display: block; font-size: 9px; font-weight: 650; }
.run-card:focus-visible { outline-offset: 9px; }
.card-ribbon { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 39px; padding: 7px 13px; background: var(--ink); color: #ffa48f; font: 850 9px/1.5 var(--mono); border-radius: 5px 5px 0 0; }
.card-ribbon > span { display: inline-flex; align-items: center; gap: 7px; }
.card-ribbon .sample-badge { color: var(--paper); font-size: 7px; }
.is-winner .card-face { border-color: #202b21; box-shadow: 0 0 0 2px #ffe597, 6px 8px 0 #15221d; }
.is-winner .card-ribbon { background: var(--gold); color: var(--ink); border-bottom: 2px solid var(--ink); }
.is-winner .card-ribbon .sample-badge { color: var(--ink); }
.hero-ribbon { padding: 6px 13px; background: var(--teal); border-bottom: 2px solid var(--ink); font: 850 9px/1.5 var(--mono); }
.card-body { padding: 17px; }
.model-name { font: 900 21px/1.25 var(--mono); letter-spacing: -.9px; }
.provider { font-size: 11px; color: var(--muted); margin-top: 5px; }
.ingame-name { font: 700 11px/1.4 var(--mono); color: var(--muted); margin-top: 4px; }
.ingame-name .player-name { color: #b3261e; }
.ingame-name .rival-name { color: #1d4ed8; }
.card-tags { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.furthest { margin-top: 12px; font: 800 11px/1.6 var(--mono); }
.furthest b { background: #dde8cc; padding: 3px 5px; margin-right: 4px; white-space: nowrap; }
.is-winner .furthest b { background: #f9df8b; }
.stats { display: grid; grid-template-columns: 1fr 1fr; margin: 13px 0; border-block: 1px solid #bdc9b9; }
.stats > div { padding: 9px 0; }
.stats > div:nth-child(even) { padding-left: 13px; border-left: 1px solid #bdc9b9; }
.stats > div:nth-child(n+3) { border-top: 1px solid #bdc9b9; }
.stats dt { font: 750 8px/1.5 var(--mono); color: var(--muted); }
.stats dd { font: 850 15px/1.5 var(--mono); }
.stats small { font-size: 9px; font-weight: 600; color: #506157; }
.free { color: #096b52; }
.card-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.compare-select { padding: 7px 9px; background: transparent; border: 1px solid #596d5d; border-radius: 4px; min-height: 36px; font: 800 10px/1.5 var(--mono); }
.compare-select[aria-pressed=true] { background: var(--teal); border-color: var(--ink); }
.compare-select:disabled { opacity: .5; }
.inspect, .button { display: inline-flex; gap: 10px; align-items: center; justify-content: center; min-height: 38px; border: 2px solid var(--ink); border-radius: 5px; padding: 7px 11px; color: var(--paper); background: var(--ink); font: 800 10px/1.5 var(--mono); text-decoration: none; }
.inspect > span { color: var(--cyan); font-size: 17px; line-height: 1; }
.inspect:hover, .button:hover { background: #294238; }
.inspect:disabled, .button:disabled { background: #dfe3d9; color: #606a60; border-color: #a3afa0; }
.vod-note { font: 650 9px/1.5 var(--mono); color: var(--muted); text-align: right; margin-top: 7px; }
.full-card .card-actions { padding-top: 14px; }
.full-card .stats dd { font-size: 17px; }
.replay-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 12px; border-bottom: 2px solid var(--ink); }
.replay-heading h3 { font: 850 11px/1.5 var(--mono); }
.replay-heading .text-button { flex: none; font-size: 9px; }
.text-button { border: 0; padding: 6px 0; text-decoration: underline; text-underline-offset: 4px; background: transparent; font: 800 11px/1.6 var(--mono); }
.replay-map { position: relative; isolation: isolate; }
.run-map { display: block; width: 100%; height: auto; shape-rendering: crispEdges; }
.map-place-names { font: 800 9px var(--mono); fill: #35513c; }
.replay-trail { fill: none; stroke: var(--gold); stroke-width: 4; stroke-linejoin: round; }
.replay-trainer, .replay-finish, .replay-skulls { pointer-events: none; }
.map-pin { --pin-color: #e5e8cb; position: absolute; left: var(--x); top: var(--y); transform: translate(-50%,-50%); width: 24px; height: 24px; padding: 0; display: grid; place-items: center; border: 2px solid #2e513d; border-radius: 50% 50% 50% 2px; color: #173627; background: var(--pin-color); font: 850 10px/1 var(--mono); z-index: 1; }
.map-pin.unreached { background: #c1cba8; color: #65715a; border-color: #819074; }
.map-pin.unknown { border-style: dashed; }
.map-pin.is-hit { --pin-color: var(--teal); box-shadow: 0 0 0 3px var(--gold); }
.map-pin.is-hit:after { content: ""; position: absolute; inset: -5px; border: 2px solid var(--gold); border-radius: 50%; animation: pin-arrival .5s ease-out both; pointer-events: none; }
.run-card:not(.replay-playing) .map-pin.is-hit:after { animation-play-state: paused; }
@keyframes pin-arrival { from { transform: scale(.8); opacity: 1; } to { transform: scale(1.9); opacity: 0; } }
.pin-sign { position: absolute; bottom: calc(100% + 9px); left: 50%; transform: translateX(-50%); width: max-content; max-width: 180px; padding: 7px 8px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); box-shadow: 3px 3px 0 #101c2066; font: 750 10px/1.5 var(--mono); text-align: left; visibility: hidden; opacity: 0; pointer-events: none; }
.map-pin.sign-left .pin-sign { left: auto; right: -8px; transform: none; }
.map-pin.sign-right .pin-sign { left: -8px; transform: none; }
.map-pin:hover, .map-pin:focus { z-index: 4; }
.map-pin:hover .pin-sign, .map-pin:focus .pin-sign { visibility: visible; opacity: 1; }
.blackout-overlay { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 5; pointer-events: none; }
.map-caption { font: 650 8px/1.6 var(--mono); color: #3b5545; padding: 6px 12px; background: #e3ecd5; border-block: 1px solid #bac7af; }
.replay-body { padding: 11px 12px 5px; }
.running-label { font: 850 9px/1.5 var(--mono); }
.running-label span { font-size: 8px; font-weight: 650; color: var(--muted); }
.replay-stats { margin: 7px 0; }
.replay-stats > div { padding-block: 5px; }
.replay-stats dd { font-variant-numeric: tabular-nums; }
.counter-stage { position: relative; display: inline-block; }
[data-counter="turns"] { display: inline-block; transform-origin: left center; }
.sparkles { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.spark { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; background: var(--gold); box-shadow: 0 0 5px #ffdf7a; z-index: 2; }
.spark:nth-child(3n+1) { background: #ffe9a3; width: 6px; height: 6px; }
.spark:nth-child(3n+2) { background: #d99a00; width: 7px; height: 7px; }
.replay-toolbar { padding: 8px 12px 0; border-bottom: 2px solid var(--ink); background: #f3f1e4; }
.replay-controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.replay-controls button { min-height: 36px; padding: 6px 8px; border: 1px solid #596d5d; background: #e3ecd5; border-radius: 3px; font: 800 9px/1.5 var(--mono); }
.replay-controls [data-replay="play"] { background: var(--ink); color: var(--paper); min-width: 54px; }
.replay-status { margin-left: auto; color: var(--muted); font: 650 8px/1.5 var(--mono); }
.replay-progress { display: block; width: 100%; height: 6px; appearance: none; border: 0; background: #d7dfcc; accent-color: #008577; margin: 8px 0 10px; }
.replay-progress::-webkit-progress-bar { background: #d7dfcc; }
.replay-progress::-webkit-progress-value { background: #008577; }
.replay-progress::-moz-progress-bar { background: #008577; }
.provenance { display: grid; grid-template-columns: 70px minmax(0,1fr); gap: 5px 8px; font: 650 10px/1.5 var(--mono); padding: 3px 0 13px; }
.provenance dt { color: var(--muted); }
.run-details { border-top: 1px solid #bdc9b9; padding-top: 9px; }
.ladder-heading { display: flex; justify-content: space-between; gap: 6px; font: 750 8px/1.5 var(--mono); }
.ladder-heading span { color: var(--muted); font-size: 7px; }
.receipt-list { list-style: none; padding: 0; margin: 7px 0; font: 650 10px/1.5 var(--mono); }
.receipt-list li { display: grid; grid-template-columns: 19px minmax(0,1fr) 40px 42px; align-items: center; gap: 4px; padding: 4px 3px; border-top: 1px dotted #b3c1a8; }
.receipt-list .rung-number { font-size: 8px; color: var(--muted); }
.receipt-turn, .receipt-delta { text-align: right; font-variant-numeric: tabular-nums; }
.receipt-list .pending { color: #53674d; }
.receipt-list .is-hit { background: #d8ebd0; color: var(--ink); }
.receipt-list .is-hit .rung-number { background: var(--teal); color: var(--ink); text-align: center; }
.receipt-list .hardest { border-left: 3px solid #aa791c; }
.receipt-list .hardest.is-hit { background: #f5e3aa; }
.receipt-list em { display: block; font-style: normal; color: #795110; font-size: 8px; }
.receipt-list .unreached { color: #798170; }
.receipt-note { font: 650 8px/1.6 var(--mono); color: var(--muted); margin: 8px 0 10px; }
.run-details .provenance { grid-template-columns: 58px minmax(0,1fr) 47px minmax(0,1fr); gap: 4px 8px; font-size: 9px; border-top: 1px solid #bdc9b9; padding-top: 8px; }
.trophy { width: 25px; height: 28px; display: inline-block; flex: none; shape-rendering: crispEdges; }

/* podium (§ hidden winners' podium, drawn into the brock scene) — invisible hit targets that
   sit on top of the podium art (which lives inside the map SVG and can't be focused directly
   through a <use> clone), positioned by percentage so they track the scaling map image. */
.podium-hit { position: absolute; border: 0; margin: 0; padding: 0; background: transparent; cursor: pointer; }

/* hidden Mew, peeking from behind a Viridian Forest pine */
.mew-peek { transition: transform .3s ease; transform-box: fill-box; transform-origin: center; }
.mew:hover .mew-peek, .mew:focus-visible .mew-peek { transform: translateX(-4px); }
.mew-blink { opacity: 0; animation: mew-blink 9s steps(1,end) infinite; }
@keyframes mew-blink { 0%, 96%, 100% { opacity: 0; } 97%, 99% { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .001ms !important; animation: none !important; }
  html { scroll-behavior: auto; }
  .run-card .card-inner, .run-card.is-flipped .card-inner, .run-card .card-face { transform: none; }
  .card-face[inert] { visibility: hidden; }
  .map-pin.is-hit:after { display: none; }
}

@media (min-width: 1000px) {
  .stage-phone { display: none !important; }
}
@media (max-width: 999px) {
  .stage-desktop { display: none !important; }
  .stage-phone { display: block; }
}
@media (max-width: 560px) {
  .masthead { padding: 10px 14px; gap: 8px; }
  .brand-mark { width: 34px; height: 34px; }
  .wordmark { font-size: 19px; }
  .tagline { display: none; }
  .socials { gap: 7px; }
  .social-button { width: 26px; height: 26px; }
  .live-pill { display: none; }
  .rail-label { display: none; }
  dialog#run-modal { padding: 0; }
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the map</a>
<header class="masthead">
  <a class="brand" href="#" aria-label="PokéBench, back to top">
    <img src="../pokebench-logo.png" width="40" height="40" alt="" class="brand-mark">
    <span><span class="wordmark">PokéBench<span>_</span></span><span class="tagline">Billions of parameters vs. one old man.</span></span>
  </a>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const finite = value => typeof value === 'number' && Number.isFinite(value) && value >= 0;
const number = value => finite(value) ? value.toLocaleString('en-US') : '—';
const textValue = value => value == null || value === '' ? '—' : typeof value === 'object' ? JSON.stringify(value) : String(value);
const local = run => String(run.provider || '').toLowerCase().includes('ollama');
const won = run => run.furthest_index === 9;
const price = run => local(run) ? 'FREE' : finite(run.cost_usd) ? '$' + run.cost_usd.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: run.cost_usd > 0 && run.cost_usd < .01 ? 6 : 2}) : '—';
const tokens = run => finite(run.tokens_in) && finite(run.tokens_out) ? run.tokens_in + run.tokens_out : null;
const time = seconds => {
  if (!finite(seconds)) return '—';
  const s = Math.round(seconds), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`;
};
const reduced = matchMedia('(prefers-reduced-motion: reduce)');

// The real Gen-1 ladder, 10 rungs (shared.md ordering).
const milestoneList = [
  {key:'left_house', label:'Left the house', short:'Left house'},
  {key:'got_starter', label:'Got a starter', short:'Got starter'},
  {key:'route_1', label:'Reached Route 1', short:'Route 1'},
  {key:'viridian_city', label:'Reached Viridian City', short:'Viridian City'},
  {key:'got_parcel', label:"Got Oak's Parcel", short:'Parcel'},
  {key:'got_pokedex', label:'Got the Pokédex', short:'Pokédex'},
  {key:'viridian_forest', label:'Entered Viridian Forest', short:'Forest'},
  {key:'pewter_city', label:'Reached Pewter City', short:'Pewter City'},
  {key:'pewter_gym', label:"Entered Brock's Gym", short:'Entered gym'},
  {key:'beat_brock', label:'Beat Brock (Boulder Badge)', short:'Beat Brock'}
];
const modelName = run => textValue(run.model);
const milestoneLabel = run => milestoneList[run.furthest_index]?.label || 'No milestone reached';
const trophy = '<svg class="trophy" viewBox="0 0 32 37" aria-hidden="true"><use href="#art-trophy"/></svg>';

// Six places, top (Hall of Fame / Brock's Gym) to bottom (Pallet Town) — one exact sixth of the
// map SVG each, matching the six 1200x550 stacked scenes drawn below (brock, pewter, forest,
// viridian, route, pallet).
const places = [
{id:'gym', name:"Brock's Gym & Hall of Fame", rungs:[9,8], top:0,   bottom:1/6},
{id:'pewter', name:'Pewter City', rungs:[7], top:1/6,  bottom:2/6},
{id:'forest', name:'Viridian Forest', rungs:[6], top:2/6,  bottom:3/6},
{id:'viridian', name:'Viridian City', rungs:[4,3], top:3/6, bottom:4/6},
{id:'route1', name:'Route 1', rungs:[2], top:4/6, bottom:5/6},
{id:'pallet', name:'Pallet Town', rungs:[5,1,0], top:5/6, bottom:1}
];
const MAP_NAT_W = 1200, MAP_NAT_H = 3300;
const placeForRun = run => places.find(p => p.rungs.includes(run.furthest_index)) || places[places.length - 1];
const rankSort = (a, b) => b.furthest_index - a.furthest_index || (a.turns_used - b.turns_used) || String(a.model).localeCompare(String(b.model));

let RUNS = [];
let lastFocused = null;
let localHero = null;
const state = {runs: RUNS, sample: true, selected: new Set()};

function compactCard(run, rank) {
  const idx = run.furthest_index;
  const shortLabel = milestoneList[idx]?.short || milestoneList[idx]?.label || '—';
  const statusText = won(run) ? `Boulder Badge · turn ${number(run.turns_used)}` : `stopped turn ${number(run.turns_used)} · ${idx + 1}/10 ${escape(milestoneList[idx]?.label || 'No milestone reached')}`;
  const badge = rank ? `<span class="rank-badge" aria-hidden="true">#${rank}</span>` : '';
  return `<button type="button" class="compact-card ${won(run) ? 'is-winner' : ''}" data-uid="${run.uid}" aria-label="${escape(run.model)}, ${statusText}, open run details">
    ${badge}
    <span class="cc-model">${escape(run.model)}</span>
    <span class="cc-line2"><span class="cc-turn">turn ${number(run.turns_used)} · ${escape(shortLabel)}</span><span class="cc-foot"><span class="tag ${local(run) ? 'local' : 'api'}">${local(run) ? 'LOCAL' : 'API'}</span><span class="cc-cost ${local(run) ? 'free' : ''}">${price(run)}</span></span></span>
  </button>`;
}

// ---- everything below to "end copied block" is copied verbatim from site/app.js, adapted
// only to drop fetch/rail/compare wiring (the mock loads RUNS itself and has no rail/table). ----
function runTimestamp(run) {
  const raw = run.timestamp;
  if (typeof raw === 'string' && /^\d{8}_\d{6}$/.test(raw)) {
    return Date.UTC(+raw.slice(0,4), +raw.slice(4,6)-1, +raw.slice(6,8), +raw.slice(9,11), +raw.slice(11,13), +raw.slice(13,15));
  }
  if (finite(raw)) return raw < 1e12 ? raw * 1000 : raw;
  const parsed = Date.parse(raw || run.run_date || '');
  return Number.isFinite(parsed) ? parsed : -Infinity;
}
function runDay(run) {
  const date = String(run.run_date || '');
  if (/^\d{4}-\d{2}-\d{2}$/.test(date) && Number.isFinite(Date.parse(date))) return date;
  const timestamp = runTimestamp(run);
  return Number.isFinite(timestamp) ? new Date(timestamp).toISOString().slice(0,10) : '';
}
const formatDay = day => day ? new Date(day + 'T12:00:00Z').toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC'}) : 'Date not reported';
// Spec tiebreaker: same furthest milestone -> fewer turns to REACH it. turns_used ties every
// non-winner at budget, so rank on the furthest milestone's first-hit turn instead.
const furthestTurn = run => { const m = (run.milestones || []).find(x => x && x.key === run.furthest_key); return m && finite(m.turn) ? m.turn : (finite(run.turns_used) ? run.turns_used : Infinity); };
const displayRank = run => 1 + state.runs.filter(other => other.furthest_index > run.furthest_index || other.furthest_index === run.furthest_index && furthestTurn(other) < furthestTurn(run)).length;
function videoURL(run) {
  if (typeof run.youtube_url !== 'string' || !run.youtube_url.trim()) return null;
  try { const url = new URL(run.youtube_url); return ['https:', 'http:'].includes(url.protocol) ? url.href : null; } catch { return null; }
}
function inspect(run, compact = false) {
  const url = videoURL(run);
  if (url) return `<a class="inspect" href="${escape(url)}" target="_blank" rel="noopener noreferrer" aria-label="Inspect run: ${escape(modelName(run))} (opens video in a new tab)">inspect run <span aria-hidden="true">↗</span></a>`;
  return compact ? '<span class="vod-unavailable tag">VOD unavailable</span>' : `<button class="inspect" disabled title="No VOD attached" aria-label="Inspect run: ${escape(modelName(run))}, no VOD attached">inspect run ↗</button>`;
}
function stats(run) {
  return `<dl class="stats"><div><dt>TURNS</dt><dd>${number(run.turns_used)} <small>/ ${number(run.budget_turns)}</small></dd></div><div><dt>TOKENS · IN + OUT</dt><dd>${number(tokens(run))}</dd></div><div><dt>COST</dt><dd class="${local(run) ? 'free' : ''}">${price(run)}</dd></div><div><dt>TIME</dt><dd>${time(run.wall_time_s)}</dd></div></dl>`;
}
function facts(entries) {
  return `<dl class="provenance">${entries.map(([label,value]) => `<dt>${escape(label)}</dt><dd>${escape(textValue(value))}</dd>`).join('')}</dl>`;
}
// Coordinates follow the geography; the Pokédex leg doubles back to Pallet.
const tile=(id,x,y,w,h,extra='')=>`<use href="#art-${id}" x="${x}" y="${y}" width="${w}" height="${h}" ${extra}/>`;
const trees=(list,id='pine')=>list.map(([x,y,s=1])=>tile(id,x,y,100*s,130*s)).join('');
const grass=(x,y,cols,rows,color='#577955')=>`<g color="${color}">${Array.from({length:cols*rows},(_,i)=>tile('grass',x+(i%cols)*41,y+Math.floor(i/cols)*29,38,23)).join('')}</g>`;

// ---- the big map: six 1200x550 station scenes, art copied verbatim from site/app.js's `art`
// object, stitched into one inline SVG (§1). Edits from the source: roads trimmed/extended to
// run the full 0-550 height (§2), a few tiles swapped for the new building symbols (§3), and a
// small stepped-tile seam between each pair of scenes to soften the ground-colour hand-off.
const walker=(x,y,w,h)=>`<g class="walking-sprite">${tile('trainer',x,y,w,h)}</g>`;
const path_=(d,color,width)=>`<path d="${d}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linejoin="miter"/>`;
const trail=(d,tint='#d7c693')=>path_(d,'#63745b',83)+path_(d,tint,73)+`<path d="${d}" fill="none" stroke="#f6e2b2" stroke-width="53" stroke-dasharray="4 11" opacity=".35"/>`;

function trainerFor(run, cx, footY) {

function podiumStep(x, w, topY, baseY, base, dark, numeral) {
  const topH = 6, frontY = topY + topH, frontH = baseY - frontY, cx = x + w / 2;

    + (turnLine ? `<text x="${cx}" y="${y + 32}" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-weight="800" font-size="11" fill="#f8f7eb">${escape(turnLine)}</text>` : '');

function podiumMarkup() {
  const winners = RUNS.filter(won).sort((a, b) => a.turns_used - b.turns_used);
  const byRank = {1: winners[0], 2: winners[1], 3: winners[2]};
  return `<g class="podium">` + PODIUM_COLS.map(col => {

      + (run ? trainerFor(run, col.x + col.w / 2, topY) : '')
      + podiumPlaque(col.x + 5, col.w - 10, run);
  }).join('') + `</g>`;
}

// Draw order across the WHOLE map, not per scene: all backgrounds, then all far, then all
// ground, then all near — so anything overhanging a seam draws over the neighbour's ground
// instead of being clipped at its own scene's edge.
function mapArtSVG() {
  const bg = STATIONS.map((s,i) => `<rect x="0" y="${550*i}" width="1200" height="550" fill="${GROUND_COLORS[s]}"/>`).join('');
  const layer = name => STATIONS.map((s,i) => {
    let content = art[s+'-'+name] || '';
    if (name === 'ground' && s === 'brock') content += podiumMarkup();
    return `<g transform="translate(0 ${550*i})">${content}</g>`;
  }).join('');
  return bg + layer('far') + layer('ground') + layer('near');
}

const linePath = points => points.map(([x,y],i) => `${i ? 'L' : 'M'}${x} ${y}`).join(' ');
function linePart(points, fraction) {
  let remaining = lineLength(points) * Math.max(0,Math.min(1,fraction));
  const part = [points[0]];
  for (let i = 1; i < points.length; i++) {
    const a = points[i-1], b = points[i], length = Math.hypot(b[0]-a[0],b[1]-a[1]);
    if (remaining < length) { part.push([a[0]+(b[0]-a[0])*remaining/length,a[1]+(b[1]-a[1])*remaining/length]); break; }
    part.push(b); remaining -= length;
  }
  return part;
}
function ladder(run) {
  const turns = milestoneList.map(m => {
    const receipts = run.milestones.filter(item => item.key === m.key && finite(item.turn));
    return receipts.length ? Math.min(...receipts.map(item => item.turn)) : null;
  });
  return milestoneList.map((m,i) => {
    const turn = turns[i], previous = i ? turns[i-1] : 0;
    return {...m, turn, reached: finite(turn) || i <= run.furthest_index,
      delta: finite(turn) && finite(previous) && turn >= previous ? turn-previous : null};
  });
}

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    RUNS = rows.map((r, i) => ({...r, uid: r.run_id || ('run-' + i)}));
    state.runs = RUNS;
  } catch (err) {
    $('data-state').textContent = 'Could not load mock-runs.json (' + err.message + ').';
    return;
  }
  $('data-state').hidden = true;
  document.getElementById('map-art').innerHTML = mapArtSVG(); // regenerate now that RUNS/podium data is real
  $('stage-desktop').hidden = false;
  $('stage-phone').hidden = false;
  renderRail();
  renderDesktop();
  renderPhone();
  renderPodiumHitboxes();
  observePlaces();
  layoutDesktopBands();
  document.querySelector('.rail-dot').classList.add('is-current');
}
boot();
})();
</script>
</body>
</html>
