  # Azure Grok rates (2026-09-16) come from the retail-prices API, Global (non-Data-Zone) meters,
  # per 1K tokens x1000: `curl "https://prices.azure.com/api/retail/prices?$filter=armRegionName eq
  # 'westus3' and contains(productName,'Grok')"`. 4.1 Fast 0.20/0.50 - 4.2 (=4.20, both variants)
  # 1.25/2.50 - 4.3 1.25/2.50 - 4.6 2.00/6.00 (the "L" long-context meters double that; the harness
  # never reaches them). Input CROSS-CHECKED against Cost Management: 4.1 Inp $8.88 = 44.40M tokens
  # x 0.20 across all three 4.1 runs, exact. ⚠️ The 4.1 Outp meter shows $0.25 against 8.41M
  # completion tokens (would be $4.21) - either output meters post later than input, or Azure is
  # not billing reasoning tokens as output. Unresolved; treat cost_usd on reasoning rows as a
  # CEILING until the bill settles.
  # gpt-6-astra is OpenAI-published but deployed on the FOUNDRY resource, so it uses the
  # azure-foundry env pair while its usage follows OpenAI semantics (reasoning inside
  # completion). That needs no second class: AzureFoundryProvider._tokens reconciles against
  # total_tokens per response rather than per publisher. Verified 2026-09-20 against a real
  # frame -- vision and strict json_schema both answer on /openai/v1/chat/completions.
  # Rates null for the same reason as the rows below: Azure does not publish them and the
  # OpenAI direct price must not be copied across.
  - key: azure-gpt-6-astra
    provider: azure-foundry
    api_model_id: gpt-6-astra-1  # deployment name; the model behind it is gpt-6-astra-2026-09-03
    display_name: "GPT-6 Astra"
    family: gpt
    params: null
    quant: null
    context: 131072 # Harness history budget, not a vendor claim. See azure-grok-4-20-reasoning.
    think: high
    release_date: "2026-09-03"
    # Global (non-Data-Zone) SHORT-context meters, westus3, from the retail-prices API:
    # `contains(meterName,'6-astra')`. Searching for "gpt-6" or "Astra" returns nothing -- the
    # meters are named "6-astra ShortCo Inp Std Gl 1M Tokens", which is also exactly what the
    # portal's cost chart legend shows. LongCo doubles these ($20/$75) and the harness never
    # reaches it; Data Zone is 10% more. Cached input is a separate $1.00/M meter that cost()
    # deliberately does not model, so a run with cache hits records slightly high.
    # Cross-checked 2026-09-20: 275.64K in + 16.15K out billed $3.52, against $3.56 at these
    # rates, the gap being that cached meter.
    input_cost_per_mtok: 10.00
    output_cost_per_mtok: 50.00
    # Every other row omits this, which OpenAIProvider treats as "use the model's own maximum".
    # On 2026-09-20 Astra took that literally: one turn streamed 13.9 MB of SSE and was still
    # climbing at ~37 KB/s when it was killed. A SILENCE timeout cannot catch that -- the poll
    # re-arms on every chunk -- so the cap is the only thing that ends it. Observed plans are
    # 43-83 completion tokens, so this is ~50x headroom and should never truncate a real one.
    max_output_tokens: 4000
    # 90s, not the 600s default. OpenAIProvider streams, so `timeout` is a SILENCE window, and
    # Astra opened a TLS connection on turn 22 that then sent nothing -- deployment healthy in
    # parallel, 149,991 of 150,000 TPM free, zero 429s. At the default that costs ten minutes of
    # dead air per hang, and because ERROR_WINDOW is 1800s three hangs in a row abort the whole
    # run as provider_error. Observed model time is 3-4s, so this is still ~20x headroom.
    timeout: 90
    # 300s, not the 900s default, because this is the row the guard was written for and we have
    # its numbers: worst SUCCESSFUL call in the winning run was 26.0s. A runaway now ends in
    # five minutes instead of never. Do not copy this onto a row you have not measured -- the
    # loose default exists so an unmeasured slow model retries rather than dying provider_error.
    max_call_s: 300

