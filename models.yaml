  # DeepSeek 3.2, MiniMax M2.5) are TEXT-ONLY and cannot play at all; these two are the
  # strongest that actually accept an image. Both read a real intro frame correctly,
  # including the dialog text and the continue arrow.
  # ⚠️ kimi-k2.5 at think: high spends ~2,000 completion tokens/turn on reasoning (vs ~85
  # at default), and its reasoning occasionally runs far past its own median. Capped at
  # 8192 it hit finish_reason=length on roughly every other turn of a live test. It is
