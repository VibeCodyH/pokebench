# Registry shape: {models: [entry, ...]}. Costs are USD per 1,000,000 tokens.
# params is parameter-count metadata, not request options. null means unknown.
# Unverified rates/dates are null on purpose: an honest unknown beats a fabricated number.
# cost() returns null when rates are null, so the run records cost_usd: null.
models:
  - key: "qwen3.8:27b"
    provider: ollama
    api_model_id: "qwen3.8:27b"
    family: qwen
    params: "27B"
    quant: "Q4_K_M" # Matches the existing harness's recorded local configuration.
    context: 65536 # Configured harness context; not a claim about the model's maximum.
    think: low
    release_date: null # TODO: verify the model release date; do not use the run date.
    input_cost_per_mtok: 0.0 # local inference: genuinely free
    output_cost_per_mtok: 0.0

  - key: claude-haiku-4-5
