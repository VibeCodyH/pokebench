    api_model_id: claude-haiku-4-5-20251001 # verified: the id run in prior smoke tests
    family: claude
    params: null
    quant: null
    context: 200000 # TODO: verify supported context before a scored run.
    think: low
    release_date: null # TODO: verify.
    input_cost_per_mtok: null # TODO: set the authoritative Haiku 4.5 rates before a scored run.
    output_cost_per_mtok: null

