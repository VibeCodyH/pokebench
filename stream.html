<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokéBench · Live</title>
<style>
  :root{
    --ink:#101c20; --paper:#f8f7eb; --teal:#2dd4bf; --gold:#ffce52; --red:#ff7661;
    --muted:#506157; --ground:#bcdba0; --ground-deep:#a8d59a;
    --mono:ui-monospace,"Cascadia Code","SFMono-Regular",Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper)}
  body{color:var(--ink);font:14px/1.6 var(--sans);display:flex;align-items:center;justify-content:center}
  [hidden]{display:none !important}
  /* fixed canvas 1280x720 scaled by JS */
  #app{width:1280px;height:720px;overflow:hidden;background:var(--paper);position:absolute;left:0;top:0;transform-origin:top left;display:flex;flex-direction:column;flex:none}
  /* masthead 0..56 (56px) */
  #masthead{flex:0 0 56px;height:56px;display:flex;align-items:center;gap:16px;padding:5px 24px;border-bottom:3px solid var(--ink);background:var(--paper);position:relative;z-index:2;box-sizing:border-box}
  .brand{display:flex;align-items:center;gap:10px;flex:none}
  .wordmark{font:950 27px/1.1 var(--mono);letter-spacing:-1.5px;display:block}
  .wordmark span{color:#008577}
  .tagline{display:block;font:800 9px/1.4 var(--mono);letter-spacing:.08em;color:#4b5c53;margin-top:3px}
  .model-kicker{margin-left:auto;margin-right:auto;display:inline-block;background:var(--ink);color:var(--paper);padding:5px 10px;border:2px solid var(--ink);box-shadow:3px 3px 0 #101c2033;font:800 10px/1.5 var(--mono);letter-spacing:.045em}
  .mast-right{display:flex;align-items:center;gap:10px;flex:none}
  .run-chip{font:800 10px var(--mono);letter-spacing:.06em;display:flex;align-items:center;gap:6px}
  .run-chip b{font:800 10px var(--mono);background:var(--ink);color:var(--paper);padding:4px 8px;border:2px solid var(--ink);box-shadow:2px 2px 0 #101c2033;border-radius:5px;white-space:nowrap}
  .run-chip b#runName{max-width:160px;overflow:hidden;text-overflow:ellipsis}
  .chip-mini{display:inline-flex;align-items:center;gap:4px;background:var(--ink);color:var(--paper);padding:4px 8px;border:2px solid var(--ink);box-shadow:2px 2px 0 #101c2033;border-radius:5px;font:800 10px var(--mono);letter-spacing:.06em;white-space:nowrap}
  .chip-mini em{font-style:normal;color:var(--teal);font-weight:900}
  .live{display:flex;align-items:center;gap:7px;font:800 10px var(--mono);letter-spacing:.06em;color:var(--muted);white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:99px;background:#9db0a8;border:1.5px solid var(--ink);flex:none}
  .dot.on{background:#00c9a7;animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,201,167,.5)}70%{box-shadow:0 0 0 7px rgba(0,201,167,0)}100%{box-shadow:0 0 0 0 rgba(0,201,167,0)}}
  /* main content 56..668 (612px) */
  #main{flex:0 0 612px;height:612px;display:grid;grid-template-columns:664px 544px;gap:24px;padding:0 24px;position:relative;z-index:1;min-height:0;align-items:start;box-sizing:border-box}
  .left-col{display:flex;flex-direction:column;gap:0;min-height:0;height:612px}
  .right-col{display:flex;flex-direction:column;gap:10px;min-height:0;height:612px}
  /* game boy card exactly 612px: ribbon 30 + 576 screen + 6 padding (6 accounted as outer - ribbon - screen) */
  .gb-card{background:var(--paper);border:3px solid var(--ink);border-radius:9px;box-shadow:5px 6px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;height:612px;flex:0 0 612px;box-sizing:border-box;position:relative}
  .card-ribbon{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 30px;height:30px;min-height:30px;padding:0 12px;background:var(--ink);color:var(--paper);font:800 9px/1.5 var(--mono);letter-spacing:.09em;border-radius:5px 5px 0 0;box-sizing:border-box}
  .card-ribbon .ribbon-meta{display:flex;align-items:center;gap:6px;font:800 10px var(--mono);letter-spacing:.02em;white-space:nowrap}
  .card-ribbon .ribbon-meta b{font:800 10px var(--mono);color:var(--paper)}
  .card-ribbon .ribbon-meta .sep{opacity:.6}
  #screen-wrap{background:#25302a;display:flex;align-items:center;justify-content:center;overflow:hidden;line-height:0;flex:0 0 576px;height:576px}
  #screen{display:block;width:640px;height:576px;image-rendering:pixelated;image-rendering:crisp-edges;object-fit:fill;background:#1e2a22;flex:none}
  /* thought bubble 190px */
  .thought-card{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:9px;box-shadow:5px 6px 0 var(--ink);padding:13px 14px 10px 14px;height:190px;flex:0 0 190px;display:flex;gap:12px;overflow:hidden;box-sizing:border-box}
  .thought-card::before{content:"";position:absolute;left:-9px;top:38px;width:16px;height:16px;background:var(--paper);border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg);z-index:1}
  .trainer-side{flex:0 0 56px;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:2px}
  .trainer-side svg{width:44px;height:66px;shape-rendering:crispEdges;display:block}
  .trainer-side .eyb{font:800 7px var(--mono);letter-spacing:.08em;color:var(--muted)}
  .thought-main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
  .eyebrow{font:800 10px/1.6 var(--mono);letter-spacing:.09em;color:var(--muted)}
  #thought{font:400 16px/1.4 var(--sans);color:var(--ink);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;flex:1 1 auto;min-height:0;word-break:break-word}
  #inputs{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;min-height:22px;align-items:flex-start;padding-top:8px}
  #inputs .chip{display:inline-flex;align-items:center;padding:4px 8px;border:1.5px solid var(--ink);background:var(--paper);border-radius:6px;font:800 10px var(--mono);letter-spacing:.04em;box-shadow:1.5px 1.5px 0 var(--ink);white-space:nowrap;line-height:1}
  /* journey strip 84px: two full-width rows */
  .journey-card{background:var(--paper);border:3px solid var(--ink);border-radius:9px;box-shadow:5px 6px 0 var(--ink);padding:8px 12px 8px;height:84px;flex:0 0 84px;display:flex;flex-direction:column;gap:6px;overflow:hidden;box-sizing:border-box}
  .journey-row{display:flex;align-items:center;gap:10px}
  .journey-row.badges-row{flex:0 0 auto}
  .journey-row.party-row{flex:1 1 auto;min-height:0}
  .journey-label{font:800 10px/1.6 var(--mono);letter-spacing:.09em;color:var(--ink);white-space:nowrap;flex:none}
  .journey-left{display:flex;align-items:center;gap:8px;flex:none}
  .journey-left .eyebrow{color:var(--ink)}
  #badgeCount{font:800 10px var(--mono);background:var(--ink);color:var(--paper);padding:3px 7px;border-radius:99px;letter-spacing:.04em;flex:none}
  #badges{display:flex;gap:6px;flex:none}
  #ladder{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;flex:1;min-width:0}
  #ladder .rung{border:2px dashed #b9b4a4;border-radius:6px;padding:3px 0;text-align:center;font:800 8px/1.2 var(--mono);letter-spacing:0;color:#9a958a;min-width:0;overflow:hidden}
  #ladder .rung b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #ladder .rung small{display:block;font-size:8px;opacity:.85;white-space:nowrap}
  #ladder .rung.hit{border:2px solid var(--ink);background:var(--gold);color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
  #ladder .rung.next{border:2px solid var(--ink);color:var(--ink);background:var(--paper)}
  .badge{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;flex:none;position:relative}
  .badge.earned{background:var(--gold);border:2px solid var(--ink);box-shadow:1.5px 1.5px 0 var(--ink)}
  .badge.ghost{border:1.5px dashed var(--ink);background:transparent;opacity:.35}
  .badge svg{width:22px;height:22px;shape-rendering:crispEdges;display:block}
  #party{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;min-width:0}
  .mini-mon{border:1.5px solid var(--ink);border-radius:6px;background:var(--paper);padding:4px 6px 4px;min-height:34px;display:flex;flex-direction:column;gap:3px;justify-content:center;min-width:0;overflow:hidden}
  .mini-mon.empty{border-style:dashed;opacity:.35;display:grid;place-items:center;font:800 12px var(--mono);color:var(--ink);min-height:34px}
  .mini-mon .mn{font:800 9px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini-mon .hp{display:flex;align-items:center;gap:5px}
  .mini-mon .hp .lv{font:800 9px var(--mono);color:#008577;flex:none}
  .mini-mon .hp .hpbar{flex:1;min-width:0}
  .hpbar{height:5px;border-radius:99px;background:#e9e6d6;overflow:hidden;border:1px solid #b8b5a8}
  .hpbar i{display:block;height:100%;border-radius:99px}
  /* field log 318px */
  .log-card{background:var(--paper);border:3px solid var(--ink);border-radius:9px;box-shadow:5px 6px 0 var(--ink);padding:10px 12px 8px;flex:0 0 318px;height:318px;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-sizing:border-box}
  .log-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;flex:none}
  #log{flex:1;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-height:0;-webkit-mask-image:linear-gradient(to bottom,#000 78%,transparent 97%);mask-image:linear-gradient(to bottom,#000 78%,transparent 97%)}
  #log .row{font:600 12px/1.35 var(--sans);padding:4px 7px;overflow:hidden;display:flex;align-items:flex-start;gap:6px;flex:none;min-height:24px;border-bottom:1px dashed #cfcabd;word-break:break-word}
  #log .row.normal{color:var(--ink);background:transparent;white-space:normal}
  #log .row.moment{background:var(--gold);color:var(--ink);border:1px solid var(--ink);border-radius:6px;box-shadow:1.5px 1.5px 0 var(--ink);border-bottom-style:solid;margin-bottom:1px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;-webkit-line-clamp:unset}
  #log .row.moment .ic{color:var(--ink)}
  #log .row .ic{flex:none;font-size:11px}
  #log .row:nth-child(1){opacity:1}
  #log .row:nth-child(2){opacity:.85}
  #log .row:nth-child(3){opacity:.70}
  #log .row:nth-child(4){opacity:.55}
  #log .row:nth-child(n+5){opacity:.40}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  #log .row.new{animation:fadeIn .22s ease}
  /* ground band 668..720 (52px) FULLY visible */
  #ground{flex:0 0 52px;height:52px;background:var(--ground);border-top:3px solid var(--ink);display:flex;align-items:center;justify-content:center;z-index:2;overflow:hidden;position:relative;box-sizing:border-box}
  #ground .grass-trail{position:absolute;left:0;right:0;top:-14px;height:28px;display:flex;gap:0;color:#5a8a4a;opacity:1;pointer-events:none;overflow:hidden}
  #ground .grass-trail svg{flex:none;width:38px;height:23px;shape-rendering:crispEdges}
  #ground .ground-label{font:800 9px var(--mono);letter-spacing:.09em;color:var(--ink);opacity:.85;z-index:1;text-align:center;white-space:nowrap}
  .ground-deco{position:absolute;bottom:10px;pointer-events:none;shape-rendering:crispEdges}
  .ground-deco.house{left:74%;width:92px;height:77px}
  .ground-deco.tree{left:6%;width:64px;height:84px;opacity:.95}
  .ground-deco.tree2{left:88%;width:52px;height:68px;opacity:.9}
</style>
</head>

<div id="app">
  <header id="masthead">
    <div class="brand">
      <div><div class="wordmark">Pok<span>é</span>Bench</div><div class="tagline" id="tagline">POKÉMON RED</div></div>
    </div>
    <span class="model-kicker" id="model">—</span>
    <div class="mast-right">
      <span class="run-chip"> <b id="runName">—</b></span>

    </div>
  </header>

  <div id="main">
    <div class="left-col">
      <div class="gb-card">
        <div class="card-ribbon"><span>NOW PLAYING · POKÉMON RED</span><span class="ribbon-meta"><b id="rLoc">—</b><span class="sep"> · </span><span id="rPos">—</span><span class="sep"> · </span>$<span id="rMoney">—</span><span class="sep"> · </span>dex <span id="rDex">0</span></span></div>

<script>
const $=id=>document.getElementById(id), screenEl=$('screen');
const BADGES=["BLD","CSC","THD","RBW","SOU","MSH","VOL","ERT"];
let caught=0;
let _lastLogText="";
function show(b64){ if(typeof b64==='string'&&b64.length) screenEl.src='data:image/png;base64,'+b64.replace(/^data:image\/png;base64,/,''); }
function esc(s){ return (s||'').toString(); }
function logRow(txt,moment){
  const t = esc(txt);
  if(!t) return;
  if(t === _lastLogText) return;
  _lastLogText = t;
  const d=document.createElement('div'); d.className='row '+(moment?'moment':'normal')+' new';
  const ic = moment?'<span class="ic">★</span>':'<span class="ic">💭</span>';
  d.innerHTML=ic+'<span style="flex:1;min-width:0;overflow:hidden">'+t+'</span>'; const l=$('log'); l.prepend(d);
  setTimeout(()=>d.classList.remove('new'),320);
  while(l.children.length>30) l.lastChild.remove(); }

function setThought(t){ $('thought').textContent=t||''; }
const INPUT_MAP={walk_up:"▲",walk_down:"▼",walk_left:"◀",walk_right:"▶",press_a:"A",press_b:"B",press_start:"START",press_select:"SELECT",a_until_dialog_end:"A… (skip text)",wait_60:"wait",hold_a_30:"hold A"};
function setInputs(str){ const box=$('inputs'); box.innerHTML=''; (str||'').split(/\s+/).filter(Boolean).forEach(a=>{
  const s=document.createElement('span'); s.className='chip'; const label=INPUT_MAP[a]||a; s.textContent=label; s.title=a; box.appendChild(s); }); }

function handle(m){
  switch(m.type){
    case 'screenshot': if(m.data&&m.data.image) show(m.data.image); break;
    case 'milestone': if(m.key){ hit[m.key]=m.turn; renderLadder(); } break;
    case 'reasoning': case 'thought': setThought(m.text); logRow(esc(m.text)); break;
    case 'decision': setInputs(m.text); break;
    case 'key_moment': case 'moment':
      logRow(esc(m.description),true);
      if((m.category||'').toLowerCase()==='catch') caught++;
      break;
    case 'replay': (m.events||[]).slice(-12).forEach(handle); break;
  }
}

function renderObjectives(objs){
  const map={primary:'p',secondary:'s',tertiary:'t3'}, tag={primary:'P',secondary:'S',tertiary:'T'};
  $('objectives').innerHTML=(objs||[]).map(o=>`<div class="obj ${map[o.tier]||'t3'} ${o.done?'done':''}">
    <span class="t">${o.done?'✓':(tag[o.tier]||'·')}</span><span>${esc(o.text)}</span></div>`).join('');
}
// Company colors per model family until each model has its own sprite (issue #11). Matched on the model id.
const FAMILIES=[
  {m:/claude|anthropic/i, name:'CLAUDE', primary:'#d97757', light:'#f3d7c3', shirt:'#f8f1e8', dark:'#3a2a22'},
  {m:/gpt|openai|^o[0-9]/i, name:'GPT', primary:'#10a37f', light:'#c6efe2', shirt:'#f1f5f3', dark:'#1a1a1a'},
  {m:/gemini|gemma/i, name:'GEMINI', primary:'#4285f4', light:'#cfe0fc', shirt:'#fbbc05', dark:'#174ea6'},
  {m:/grok|xai/i, name:'GROK', primary:'#1a1a1a', light:'#9a9a9a', shirt:'#e8e8e8', dark:'#000'},
  {m:/llama|muse|meta/i, name:'META', primary:'#0866ff', light:'#c9dcff', shirt:'#eef3ff', dark:'#0a3d91'},
  {m:/mistral|pixtral|ministral/i, name:'MISTRAL', primary:'#ff7000', light:'#ffd9b8', shirt:'#ffe5a3', dark:'#7a2e00'},
  {m:/deepseek/i, name:'DEEPSEEK', primary:'#4d6bfe', light:'#d3dbff', shirt:'#eef0ff', dark:'#1f2f8a'},
  {m:/glm|zhipu|z\.ai/i, name:'GLM', primary:'#3b5bdb', light:'#d0d8f7', shirt:'#eef1fb', dark:'#1c2d7a'},
  {m:/kimi|moonshot/i, name:'KIMI', primary:'#111', light:'#8fd3ff', shirt:'#eaf6ff', dark:'#000'},
  {m:/qwen|qwq|alibaba/i, name:'QWEN', primary:'#6f42c1', light:'#e0d3f7', shirt:'#f1ecfb', dark:'#3b1f75'},
];
function applyFamily(modelId){
  const f=FAMILIES.find(x=>x.m.test(modelId||''))||{name:(modelId||'MODEL').split(/[:\/]/)[0].toUpperCase().slice(0,10)};
  const el=document.querySelector('.trainer-side');
  ['primary','light','shirt','dark'].forEach(k=>{ if(f[k]) el.style.setProperty('--sp-'+k,f[k]); else el.style.removeProperty('--sp-'+k); });
  $('spriteName').textContent=f.name; $('thinkHead').textContent=f.name+' IS THINKING';
}
const RUNG_SHORT={left_house:'House',route_1:'Route 1',got_starter:'Starter',viridian_city:'Viridian',got_parcel:'Parcel',got_pokedex:'Pokédex',viridian_forest:'Forest',pewter_city:'Pewter',pewter_gym:'Gym',beat_brock:'Brock'};
let ladder=[], hit={}, lastModel='', lastGameId='';
function renderLadder(){
  if(!ladder.length) return;
  let nextSeen=false;
  $('ladder').innerHTML=ladder.map(r=>{
    const t=hit[r.key];
    let cls='rung'; if(t!=null) cls+=' hit'; else if(!nextSeen){cls+=' next'; nextSeen=true;}
    return `<div class="${cls}" title="${esc(r.label)}"><b>${esc(RUNG_SHORT[r.key]||r.label)}</b><small>${t!=null?'turn '+esc(t):'—'}</small></div>`;
  }).join('');
}
function renderBadges(n){
  $('badgeCount').textContent=n+'/8';
  $('badges').innerHTML=BADGES.map((b,i)=>{
    if(i<n) return `<div class="badge earned" title="${b}"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#art-badge"/></svg></div>`;
    return `<div class="badge ghost" title="${b}"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#art-badge"/></svg></div>`;
  }).join('');
}
function renderParty(party){
  const slots=[];
  for(let i=0;i<6;i++){ const m=party[i];
    if(!m){ slots.push('<div class="mini-mon empty">—</div>'); continue; }
    const pct=m.max_hp?Math.max(0,Math.min(100,100*m.hp/m.max_hp)):0;
    let col='#34a853'; if(pct<25) col='#e05a33'; else if(pct<55) col='#e8b84b';
    slots.push(`<div class="mini-mon"><div class="mn">${esc(m.nickname||m.species)}</div>
      <div class="hp"><span class="lv">L${esc(m.level)}</span><div class="hpbar"><i style="width:${pct}%;background:${col}"></i></div></div></div>`);
  }
  $('party').innerHTML=slots.join('');
}

async function pollMeta(){
  try{
    const [s,g,o,gl,ms,rm]=await Promise.all([
      fetch('/state').then(r=>r.json()),
      fetch('/games/current').then(r=>r.json()).catch(()=>({})),
      fetch('/objectives').then(r=>r.json()).catch(()=>({})),
      fetch('/games').then(r=>r.json()).catch(()=>({games:[]})),
      fetch('/milestones').then(r=>r.json()).catch(()=>null),
      fetch('/run_meta').then(r=>r.json()).catch(()=>null)
    ]);
    // A new game must not inherit the previous run's overlay. The ladder and the header
    // re-sync from the server every poll, but the log rows, the catch count, the thought
    // bubble and the session clock live only in this page, so /games/new cannot clear them.
    // Keyed on the game id rather than the model so restarting the SAME model also resets.
    const gid=(g&&g.active&&g.active.id)||'';
    if(gid && gid!==lastGameId){
      lastGameId=gid;
      $('log').innerHTML=''; _lastLogText=''; caught=0;
      setThought(''); setInputs(''); sesAnchor=Date.now();
    }
    if(rm&&rm.model){ const ctxTxt = rm.ctx ? ` · ${Math.round(rm.ctx/1024)}K ctx` : ''; $('tagline').textContent=`${rm.route==='api'?'API':'LOCAL'} LLM · POKÉMON RED`; $('model').textContent=`${rm.display_name||rm.model} · ${rm.route||'local'}${ctxTxt}`; if(rm.model!==lastModel){ lastModel=rm.model; applyFamily(rm.model); } }
    const p=s.player||{}, map=s.map||{}, pos=p.position||{}, fl=s.flags||{};
    $('rLoc').textContent=map.map_name||'—';
    $('rCell').textContent=(s.collision&&s.collision.player_cell)||'E5';
    $('rPos').textContent=`${pos.x??'—'},${pos.y??'—'}`;
    const money = (p.money??0);
    $('rMoney').textContent=String(money);
    $('rDex').textContent=(fl.pokedex_owned??0);
    renderBadges(p.badge_count||(p.badges||[]).length||0);
    if(ms&&ms.ladder){ ladder=ms.ladder; hit=ms.hit||{}; renderLadder(); }
    renderParty(s.party||[]);
    const st=(g.active&&g.active.stats)||{};
    $('tActions').textContent=st.actions??0;
    $('tTurns').textContent=st.turns??0; $('turn').textContent=st.turns??0;
    $('tBlackout').textContent=st.blackouts??0;
    $('tCaught').textContent=Math.max(caught,(s.party||[]).length);
    if(g.active&&g.active.name) $('runName').textContent=g.active.name.replace(/zelda/ig,'Qwen');
    renderObjectives((o.objectives)||(g.active&&g.active.objectives)||[]);
    if(g.active&&g.active.id){
      const gm=(gl.games||[]).find(x=>x.id===g.active.id);
      if(gm&&gm.created_at){ sesAnchor=Date.parse(gm.created_at); }
      else { const k='pb_ses_'+g.active.id; let v=localStorage.getItem(k); if(!v){v=String(Date.now());localStorage.setItem(k,v);} sesAnchor=+v; }
      localStorage.removeItem('pb_ses_nogame');
    } else {
      let v=localStorage.getItem('pb_ses_nogame'); if(!v){v=String(Date.now());localStorage.setItem('pb_ses_nogame',v);} sesAnchor=+v;
    }
  }catch(_){}
  setTimeout(pollMeta,2000);
}

let delay=1000, wsOpen=false, seenEv=0;
function setLive(txt,on){ $('status').textContent=txt; $('dot').classList.toggle('on',!!on); }
async function pollFrame(){ if(!wsOpen){ try{ const r=await (await fetch('/screenshot/base64?_t='+Date.now())).json(); show(r.image||r.data||r.base64||r.screenshot);}catch(_){} } setTimeout(pollFrame,120); }
async function pollEvents(){ if(!wsOpen){ try{ const r=await (await fetch('/events/recent?n=20')).json(); (r.events||[]).slice(seenEv).forEach(handle); seenEv=(r.events||[]).length;}catch(_){} } setTimeout(pollEvents,900); }
function connect(){
  let ws; try{ ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws'); }catch(_){ setTimeout(connect,delay); return; }
  ws.onopen=()=>{ wsOpen=true; seenEv=0; setLive('live',true); delay=1000; };
  ws.onmessage=e=>{ try{handle(JSON.parse(e.data));}catch(_){} };
  ws.onclose=()=>{ wsOpen=false; setLive('polling',true); setTimeout(connect,delay); delay=Math.min(delay*2,10000); };
  ws.onerror=()=>{ setLive('polling',true); try{ws.close();}catch(_){} };
}
let sesAnchor=+(localStorage.getItem('pb_ses_nogame')||Date.now());
setInterval(()=>{ let s=Math.max(0,Math.floor((Date.now()-sesAnchor)/1000));
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60); s=s%60;
  $('session').textContent=h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); },1000);
renderBadges(0); renderParty([]); pollFrame(); pollEvents(); pollMeta(); connect();
// fixed-canvas scaling
function fitCanvas(){
  const app=$('app');
  const s=Math.min(window.innerWidth/1280, window.innerHeight/720);
  app.style.transform='scale('+s+')';
  app.style.left=((window.innerWidth - 1280*s)/2)+'px';
  app.style.top=((window.innerHeight - 720*s)/2)+'px';
}
addEventListener('load', fitCanvas);
addEventListener('resize', fitCanvas);
fitCanvas();
// grass repeat
(function(){
  const trail=$('grassTrail');
  if(!trail) return;
  const n=Math.ceil(1280/38)+2;
  for(let i=0;i<n;i++){
    const ns=document.createElementNS('http://www.w3.org/2000/svg','svg');
    ns.setAttribute('viewBox','0 0 50 30');
    ns.setAttribute('aria-hidden','true');
    ns.innerHTML='<use href="#art-grass"/>';
    trail.appendChild(ns);
  }
})();
