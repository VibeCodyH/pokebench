      - heading "Big brains. Same buttons." [level=2] [ref=e111]
      - generic [ref=e112]:
        - generic [ref=e113]:
          - paragraph [ref=e114]:
            - strong [ref=e115]: LLMs play Pokémon. Suite 1 = Pokémon Red (Gen 1).
            - text: Same 1,000-turn budget, scored by furthest milestone; ceiling = beat Brock; tiebreaker = fewer turns. Tokens/cost/time reported, not scored.
          - paragraph [ref=e116]:
            - text: Every run preserves prompt version, settings, execution route, dates, full turn log, and VOD —
            - strong [ref=e117]: trust the video over the score.
            - text: Inspect run opens the VOD when one is attached. A grey button means it is not available.
          - paragraph [ref=e118]: Milestones come from the harness’s game-state detector. This ladder ranks progress; it does not assert that every earlier checkpoint fired. Per-run maps mark the recorded checkpoints, and settings show their first-hit turns.
          - paragraph [ref=e119]: Compare like prompt versions and settings. In-game encounters and battle RNG can vary between runs. Local and API describe the execution provider, not a separate scoring league.
          - paragraph [ref=e120]:
            - strong [ref=e121]: This is the first suite.
            - text: More generations may be added, with their own milestone ladders. Today’s results are Gen 1 only.
